[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etb-speedrun-bot-v2"
version = "1.0.0"
description = "Discord bot for linking speedrun.com profiles to roles"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MattFor", email = "mattfor@relaxy.xyz" }]
dependencies = [
    "aiohttp>=3.9",
    "orjson>=3.9",
    "pymongo>=4.13",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.urls]
Repository = "https://github.com/MattFor/etb-speedrun-bot-v2"

[project.scripts]
etb-bot = "etb_bot.__main__:run"

[tool.setuptools.packages.find]
include = ["etb_bot*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "RUF"]
ignore = ["I001", "RUF023"]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportAny = false
reportExplicitAny = false
